[bar.default]
margin_ends = 0
radius = 0
widget_spacing = 8

[calendar]
enabled = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-2"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
polkit_agent = true

[theme]
builtin = "Kanagawa"
community_palette = "Nord Aurora"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "foot", "gtk3", "gtk4", "ghostty", "hyprland", "kitty", "qt", "sway" ]
    community_ids = [ "tmux", "yazi" ]

[wallpaper]
directory = "/home/joel/Pictures/wallpapers/"
directory_dark = "/home/joel/Pictures/wallpapers/dark"
directory_light = "/home/joel/Pictures/wallpapers/light"

    [wallpaper.default]
    path = "/home/joel/Pictures/wallpapers/dark/ylia.webp"

    [wallpaper.last]
    path = "/home/joel/Pictures/wallpapers/dark/ylia.webp"

    [wallpaper.monitors.DP-1]
    path = "/home/joel/Pictures/wallpapers/dark/ylia.webp"

    [wallpaper.monitors.DP-2]
    path = "/home/joel/Pictures/wallpapers/dark/ylia.webp"
